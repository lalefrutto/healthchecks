apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "healthchecks.fullname" . }}
  labels:
    {{- include "healthchecks.labels" . | nindent 4 }}
data:
  SITE_ROOT: {{ .Values.config.siteRoot | quote }}
  {{- with .Values.config.allowedHosts }}
  ALLOWED_HOSTS: {{ . | quote }}
  {{- end }}
  DEBUG: {{ .Values.config.debug | ternary "True" "False" | quote }}
  DEFAULT_FROM_EMAIL: {{ .Values.config.defaultFromEmail | quote }}
  {{- with .Values.config.secureProxySslHeader }}
  SECURE_PROXY_SSL_HEADER: {{ . | quote }}
  {{- end }}
  {{- with .Values.email.host }}
  EMAIL_HOST: {{ . | quote }}
  EMAIL_PORT: {{ $.Values.email.port | quote }}
  EMAIL_USE_TLS: {{ $.Values.email.useTls | ternary "True" "False" | quote }}
  {{- end }}
  {{- if .Values.global.rabbitmq.enabled }}
  # Несекретные параметры брокера; пароль — в Secret (см. _helpers.tpl "healthchecks.env")
  RABBITMQ_HOST: {{ .Values.global.rabbitmq.host | quote }}
  RABBITMQ_PORT: {{ .Values.global.rabbitmq.port | quote }}
  RABBITMQ_USER: {{ .Values.global.rabbitmq.username | quote }}
  RABBITMQ_VHOST: {{ .Values.global.rabbitmq.vhost | quote }}
  CELERY_RESULT_BACKEND: {{ .Values.global.celery.resultBackend | quote }}
  CELERY_TASK_DEFAULT_QUEUE: {{ .Values.global.celery.queue | quote }}
  {{- end }}
  {{- if .Values.global.redis.enabled }}
  REDIS_HOST: {{ .Values.global.redis.host | quote }}
  REDIS_PORT: {{ .Values.global.redis.port | quote }}
  REDIS_DB: {{ .Values.global.redis.db | quote }}
  {{- end }}
  DB: "postgres"
  DB_HOST: {{ include "healthchecks.database.host" . | quote }}
  DB_PORT: {{ include "healthchecks.database.port" . | quote }}
  DB_NAME: {{ include "healthchecks.database.name" . | quote }}
  DB_USER: {{ include "healthchecks.database.user" . | quote }}
