# Секретные values — ссылки на Vault (KV v2, mount secret/), а не значения.
# Разворачиваются на лету через helm-secrets с backend'ом vals:
#   helm secrets -b vals upgrade --install healthchecks charts/healthchecks -f charts/healthchecks/secrets.yaml
# (см. scripts/deploy.sh). Обычный `helm install` эти значения не подставит.
secrets:
  secretKey: ref+vault://secret/healthchecks#/SECRET_KEY

postgresql:
  auth:
    password: ref+vault://secret/healthchecks#/DB_PASSWORD
