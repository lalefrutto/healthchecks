# Default values for healthchecks.

nameOverride: ""
fullnameOverride: ""

# global.* видят и subchart'ы (celery-worker, flower): образ приложения,
# параметры брокера и Celery — один источник для всех компонентов.
global:
  image:
    repository: healthchecks
    tag: local
    # Образ собирается локально через `minikube image build`, поэтому IfNotPresent
    pullPolicy: IfNotPresent
  imagePullSecrets: []

  # Имена ресурсов чарта healthchecks, из которых subchart'ы собирают окружение.
  # Пусто -> вычисляются из имени релиза (как в _helpers.tpl).
  app:
    configMapName: ""
    secretName: ""
    postgresqlSecretName: ""

  # --- RabbitMQ (отдельный релиз чарта cloudpirates/rabbitmq, deploy/rabbitmq) ---
  rabbitmq:
    enabled: true
    host: rabbitmq
    port: 5672
    # vhost "/" в URL кодируется как %2F -> amqp://.../%2F
    vhost: "%2F"
    # Логин — несекретный (тот же, что auth.username в deploy/rabbitmq); пароль
    # берётся из Secret'а релиза rabbitmq, ключ passwordKey
    username: healthchecks
    existingSecret: rabbitmq
    passwordKey: password

  celery:
    # django-db: результаты в Postgres через django-celery-results
    resultBackend: django-db
    queue: api-tasks

  # --- Redis (отдельный релиз charts/redis, deploy/redis) — кэш приложения ---
  redis:
    enabled: true
    host: redis
    port: 6379
    db: 0
    # Пароль — из Secret'а релиза redis (значение из Vault secret/redis)
    existingSecret: redis
    passwordKey: password

# Доп. переменные окружения для всех контейнеров приложения
# (веб, воркер, миграции, prune). См. docs/self_hosted_configuration.md
extraEnv: []
#  - name: REGISTRATION_OPEN
#    value: "False"

config:
  # Внешний адрес — совпадает с ingress.host
  siteRoot: https://healthchecks.local
  # Пусто -> хост берётся из siteRoot. Локальные адреса нужны для probe/port-forward
  allowedHosts: "healthchecks.local,localhost,127.0.0.1"
  debug: false
  defaultFromEmail: noreply@example.com
  # TLS терминируется на Ingress, по этому заголовку Django узнаёт про https
  secureProxySslHeader: "HTTP_X_FORWARDED_PROTO,https"

secrets:
  # Django SECRET_KEY. Значение живёт в Vault (secret/healthchecks#SECRET_KEY)
  # и подставляется из secrets.yaml через helm-secrets/vals — см. scripts/deploy.sh.
  # Пустое значение -> `required` в шаблоне не даст задеплоить без секрета.
  secretKey: ""
  # Имя существующего Secret с ключом SECRET_KEY вместо создания своего
  existingSecret: ""

email:
  # Хост SMTP. Если externalName.enabled — это имя ExternalName-сервиса
  host: smtp
  port: 587
  useTls: true
  # user/password задаются через extraEnv или existingSecret (EMAIL_HOST_USER, EMAIL_HOST_PASSWORD)
  externalName:
    enabled: true
    # Внешний SMTP-сервер, на который резолвится сервис `email.host`
    target: smtp.gmail.com

web:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # uWSGI-процессов на под
  uwsgiProcesses: 4
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

service:
  type: ClusterIP
  port: 80

worker:
  # Фоновые процессы sendalerts и sendreports --loop
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 256Mi

migrate:
  # Job с manage.py migrate, запускается helm-хуком после install/upgrade
  enabled: true
  backoffLimit: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

prune:
  # CronJob: prunetokenbucket + prunepingsslow
  enabled: true
  schedule: "*/10 * * * *"
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 256Mi

# Init-контейнер, ждущий готовности Postgres (pg_isready)
waitForDb:
  enabled: true
  image: postgres:16
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

ingress:
  enabled: true
  className: nginx
  host: healthchecks.local
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
  tls:
    enabled: true
    # ClusterIssuer cert-manager'а; пусто — сертификат не запрашивается,
    # ожидается готовый secret с именем secretName
    clusterIssuer: healthchecks-ca-issuer
    secretName: healthchecks-tls

certManager:
  # Создать ClusterIssuer'ы для локальной разработки:
  # selfsigned -> CA-сертификат -> CA ClusterIssuer (ingress.tls.clusterIssuer)
  createIssuers: true
  # namespace, в котором установлен cert-manager (там должен лежать CA-secret)
  namespace: cert-manager
  caCommonName: healthchecks-local-ca

# --- Subchart charts/celery-worker ---
celery-worker:
  enabled: true
  replicaCount: 1
  concurrency: 2

# --- Subchart charts/flower ---
flower:
  enabled: true
  # basicAuth ("user:password") приходит из Vault через secrets.yaml
  basicAuth: ""
  ingress:
    enabled: true
    host: flower.local

# --- Subchart charts/postgresql ---
postgresql:
  enabled: true
  auth:
    database: healthchecks
    username: healthchecks
    # Пароль живёт в Vault (secret/healthchecks#DB_PASSWORD), см. secrets.yaml
    password: ""
  persistence:
    size: 1Gi
    storageClass: manual
    hostPath:
      enabled: true
      path: /data/healthchecks-postgres

# Используется, когда postgresql.enabled=false (внешняя/managed БД)
externalDatabase:
  host: ""
  port: 5432
  database: healthchecks
  username: healthchecks
  # Secret с ключом `password`
  existingSecret: ""
