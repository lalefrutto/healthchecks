apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-env
  labels:
    {{- include "locust-test.labels" . | nindent 4 }}
type: Opaque
stringData:
  HC_API_KEY: {{ required "env.HC_API_KEY is required (--set env.HC_API_KEY=<project api key>)" .Values.env.HC_API_KEY | quote }}
  {{- with .Values.env.HC_CHECK }}
  HC_CHECK: {{ . | quote }}
  {{- end }}
