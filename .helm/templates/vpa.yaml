{{- if .Values.vpa.enabled }}
{{- /*
VPA в режиме рекомендаций (updateMode: Off): смотрим kubectl describe vpa,
руками переносим в resources. Требует установленного VPA (recommender): deploy/vpa.

web (API) масштабируется HPA по CPU, поэтому его VPA управляет только памятью
(controlledResources: memory) — HPA и VPA не спорят за одну метрику. Да и в
режиме Off VPA поды не трогает, только считает рекомендации.
*/}}
{{- if .Values.vpa.web.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "healthchecks.fullname" . }}-web
  labels:
    {{- include "healthchecks.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "healthchecks.fullname" . }}-web
  updatePolicy:
    updateMode: {{ .Values.vpa.updateMode | quote }}
  resourcePolicy:
    containerPolicies:
      - containerName: healthchecks
        minAllowed:
          memory: {{ .Values.vpa.web.minAllowedMemory }}
        maxAllowed:
          memory: {{ .Values.vpa.web.maxAllowedMemory }}
        controlledResources: ["memory"]
      # init-контейнер wait-for-db короткоживущий, рекомендации для него не нужны
      - containerName: wait-for-db
        mode: "Off"
{{- end }}
{{- if .Values.vpa.celeryWorker.enabled }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "healthchecks.fullname" . }}-celery-worker
  labels:
    {{- include "healthchecks.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-worker
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-celery-worker
  updatePolicy:
    updateMode: {{ .Values.vpa.updateMode | quote }}
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed:
          cpu: 50m
          memory: 128Mi
        maxAllowed:
          cpu: 1000m
          memory: 1Gi
        controlledResources: ["cpu", "memory"]
{{- end }}
{{- end }}
