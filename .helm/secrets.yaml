# Секретные values — ссылки на Vault (KV v2, mount secret/), а не значения.
# Разворачиваются на лету через helm-secrets с backend'ом vals:
#   helm secrets -b vals upgrade --install healthchecks .helm -f .helm/secrets.yaml
# (см. scripts/deploy.sh). Обычный `helm install` эти значения не подставит.
secrets:
  secretKey: ref+vault://secret/healthchecks#/SECRET_KEY
  # Ключи S3/MinIO для тел пингов (Задание 6)
  s3AccessKey: ref+vault://secret/minio#/access_key
  s3SecretKey: ref+vault://secret/minio#/secret_key

postgresql:
  auth:
    password: ref+vault://secret/healthchecks#/DB_PASSWORD

flower:
  # user:password для HTTP basic auth UI Flower
  basicAuth: ref+vault://secret/flower#/basic_auth
