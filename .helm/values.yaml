# Default values for healthchecks.

nameOverride: ""
fullnameOverride: ""

global:
  image:
    repository: healthchecks
    tag: local
    pullPolicy: IfNotPresent
  imagePullSecrets: []

  app:
    configMapName: ""
    secretName: ""
    postgresqlSecretName: ""

  rabbitmq:
    enabled: true
    host: rabbitmq
    port: 5672
    vhost: "%2F"
    username: healthchecks
    existingSecret: rabbitmq
    passwordKey: password

  celery:
    resultBackend: django-db
    queue: api-tasks

  redis:
    enabled: true
    host: redis
    port: 6379
    db: 0
    existingSecret: redis
    passwordKey: password

  mongodb:
    enabled: true
    host: mongodb
    port: 27017
    database: healthchecks
    username: healthchecks
    existingSecret: mongodb-custom-user-0-secret
    passwordKey: CUSTOM_PASSWORD

  s3:
    enabled: true
    endpoint: minio:9000
    bucket: healthchecks
    region: us-east-1
    secure: false
    existingSecret: ""

extraEnv: []

config:
  siteRoot: https://healthchecks.local
  allowedHosts: "healthchecks.local,localhost,127.0.0.1,healthchecks,healthchecks.healthchecks.svc.cluster.local"
  debug: false
  defaultFromEmail: noreply@example.com
  secureProxySslHeader: "HTTP_X_FORWARDED_PROTO,https"

secrets:
  secretKey: ""
  existingSecret: ""
  s3AccessKey: ""
  s3SecretKey: ""

email:
  host: smtp
  port: 587
  useTls: true
  externalName:
    enabled: true
    target: smtp.gmail.com

web:
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 400Mi
    limits:
      cpu: 1000m
      memory: 640Mi
  uwsgiProcesses: 4
  probes:
    timeoutSeconds: 5
    readinessFailureThreshold: 3
    livenessFailureThreshold: 6
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 0
    scaleDownStabilizationSeconds: 120
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

vpa:
  enabled: true
  updateMode: "Off"
  web:
    enabled: true
    minAllowedMemory: 256Mi
    maxAllowedMemory: 1Gi
  celeryWorker:
    enabled: true

service:
  type: ClusterIP
  port: 80

worker:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 256Mi

migrate:
  enabled: true
  backoffLimit: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

prune:
  enabled: true
  schedule: "*/10 * * * *"
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 256Mi

waitForDb:
  enabled: true
  image: postgres:16
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

ingress:
  enabled: true
  className: nginx
  host: healthchecks.local
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
  tls:
    enabled: true
    clusterIssuer: healthchecks-ca-issuer
    secretName: healthchecks-tls

certManager:
  createIssuers: true
  namespace: cert-manager
  caCommonName: healthchecks-local-ca

celery-worker:
  enabled: true
  replicaCount: 1
  concurrency: 2

flower:
  enabled: true
  basicAuth: ""
  ingress:
    enabled: true
    host: flower.local

# --- Subchart charts/postgresql ---
postgresql:
  enabled: true
  auth:
    database: healthchecks
    username: healthchecks
    password: ""
  persistence:
    size: 1Gi
    storageClass: manual
    hostPath:
      enabled: true
      path: /data/healthchecks-postgres

# Используется, когда postgresql.enabled=false (внешняя/managed БД)
externalDatabase:
  host: ""
  port: 5432
  database: healthchecks
  username: healthchecks
  existingSecret: ""
