# Values для чарта cloudpirates/rabbitmq (локальный minikube).
# Bitnami-образы с 2025 года отдают 403 без подписки, поэтому — Cloud Pirates
# (тот же подход: официальный образ rabbitmq:*-management, StatefulSet, PVC).
#
#   scripts/deploy-rabbitmq.sh   (логин/пароль/erlang cookie — из Vault, см. secrets.yaml)

replicaCount: 1

# Логин/пароль/erlang cookie приходят из Vault (deploy/rabbitmq/secrets.yaml)
auth:
  enabled: true

service:
  # LoadBalancer: снаружи кластера AMQP доступен через `minikube tunnel`
  # (в облаке — реальный внешний IP от провайдера)
  type: LoadBalancer
  amqpPort: 5672
  managementPort: 15672

# Management UI наружу через nginx-ingress, TLS от cert-manager
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: healthchecks-ca-issuer
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: rabbitmq.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: rabbitmq-tls
      hosts:
        - rabbitmq.local

persistence:
  enabled: true
  size: 1Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
