# Секретные values RabbitMQ — ссылки на Vault (secret/rabbitmq), разворачивает
# helm-secrets/vals при деплое (scripts/deploy-rabbitmq.sh).
auth:
  username: ref+vault://secret/rabbitmq#/username
  password: ref+vault://secret/rabbitmq#/password
  erlangCookie: ref+vault://secret/rabbitmq#/erlang_cookie
