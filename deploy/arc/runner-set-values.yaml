githubConfigUrl: https://github.com/lalefrutto/healthchecks

# 0 в простое: под runner'а создаётся только под job и удаляется после
minRunners: 0
maxRunners: 2

# Docker в runner'е не нужен: образ собирает GitHub-hosted job, здесь — только
# helm/kubectl. Без dind под легче и не требует privileged.
containerMode:
  type: ""

template:
  spec:
    # ServiceAccount с правами на namespace healthchecks (deploy/arc/rbac.yaml)
    serviceAccountName: minikube-runner
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
