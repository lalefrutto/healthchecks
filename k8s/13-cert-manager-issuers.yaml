# Требует установленного cert-manager:
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.19.2/cert-manager.yaml
#
# Схема для локальной разработки:
#   selfsigned ClusterIssuer  ->  CA-сертификат healthchecks-ca  ->  CA ClusterIssuer
# Сертификаты для Ingress выпускает CA-issuer, поэтому достаточно один раз
# добавить healthchecks-ca в доверенные на машине разработчика, и браузер
# перестанет ругаться. В облаке вместо этого используется ClusterIssuer
# типа ACME (Let's Encrypt) — сам Ingress при этом не меняется, только
# аннотация cert-manager.io/cluster-issuer.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: healthchecks-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: healthchecks-local-ca
  secretName: healthchecks-ca-secret
  duration: 87600h # 10 лет
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: healthchecks-ca-issuer
spec:
  ca:
    # Secret должен лежать в namespace самого cert-manager
    secretName: healthchecks-ca-secret
