apiVersion: v1
kind: Secret
metadata:
  name: healthchecks-secrets
  namespace: healthchecks
type: Opaque
stringData:
  # Смените значения перед реальным использованием.
  # Используется и Postgres (как POSTGRES_PASSWORD), и Django-приложением (как DB_PASSWORD).
  DB_PASSWORD: "change-me-strong-password"
  # Секрет для подписи сессий/CSRF Django. Сгенерировать можно так:
  # python -c "import secrets; print(secrets.token_urlsafe(50))"
  SECRET_KEY: "change-me-django-secret-key"
