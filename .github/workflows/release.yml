# CI/CD (Задание 8):
#   push в master -> semantic-release считает версию по conventional commits и
#   ставит тег vX.Y.Z (+ GitHub Release) -> по тегу собирается docker-образ и
#   пушится в GHCR -> деплой в кластер с self-hosted runner'а (Часть 2).
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: Semantic release (tag)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # теги и GitHub Release
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Semantic release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          if [ "${{ steps.semantic.outputs.new_release_published }}" = "true" ]; then
            echo "Новый релиз: ${{ steps.semantic.outputs.new_release_git_tag }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Релиз не создан: нет коммитов feat/fix/... с прошлого тега" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build & push image ${{ needs.release.outputs.tag }}
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.release.outputs.tag }}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ${{ needs.release.outputs.tag }} (self-hosted)
    needs: [release, build]
    # DEPLOY_ENABLED=true ставится в Variables репозитория, когда runner из
    # Части 2 подключён; до этого job пропускается, а не висит в очереди
    if: needs.release.outputs.published == 'true' && vars.DEPLOY_ENABLED == 'true'
    # Runner scale set из Части 2 (ARC в кластере minikube)
    runs-on: minikube-runners
    environment: minikube
    env:
      VAULT_ADDR: ${{ vars.VAULT_ADDR || 'http://vault.vault.svc.cluster.local:8200' }}
      VAULT_AUTH_METHOD: approle
      VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
      VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - uses: azure/setup-kubectl@v4

      - name: Install vals, vault CLI, helm-secrets
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/helmfile/vals/releases/download/v0.41.2/vals_0.41.2_linux_amd64.tar.gz | tar xz -C /usr/local/bin vals
          curl -fsSL https://releases.hashicorp.com/vault/1.18.5/vault_1.18.5_linux_amd64.zip -o /tmp/vault.zip
          unzip -o -q /tmp/vault.zip -d /usr/local/bin
          helm plugin install https://github.com/jkroepke/helm-secrets --version v4.7.7
          vals version && vault version && helm secrets --version

      - name: Deploy with helm-secrets (secrets from Vault)
        run: |
          set -euo pipefail
          # Runner работает в кластере под своим ServiceAccount (RBAC в deploy/arc)
          kubectl -n healthchecks get deploy healthchecks-web -o name
          # AppRole -> токен; vals читает ref+vault:// в secrets.yaml
          export VAULT_TOKEN
          VAULT_TOKEN="$(vault write -field=token auth/approle/login role_id="$VAULT_ROLE_ID" secret_id="$VAULT_SECRET_ID")"
          export VAULT_AUTH_METHOD=token
          helm secrets --backend vals upgrade --install healthchecks charts/healthchecks \
            --namespace healthchecks \
            -f charts/healthchecks/values.yaml \
            -f charts/healthchecks/secrets.yaml \
            --set global.image.repository="${IMAGE}" \
            --set global.image.tag="${{ needs.release.outputs.tag }}" \
            --set global.image.pullPolicy=IfNotPresent \
            --wait --timeout 10m
          kubectl -n healthchecks rollout status deploy/healthchecks-web --timeout=5m
          echo "Задеплоен ${IMAGE}:${{ needs.release.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
